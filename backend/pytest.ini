[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = app
python_files = test_*.py
python_classes = Test*
python_functions = test_*
log_cli = false
log_level = WARNING
markers =
    musdb: tests requiring MUSDB18 sample dataset (pip install musdb)
    model_eval: model quality evaluation tests with SDR/SIR/SAR metrics (requires GPU + demucs)
filterwarnings =
    ignore::DeprecationWarning
    ignore::pytest.PytestUnraisableExceptionWarning
